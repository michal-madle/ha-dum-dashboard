# Dům Dashboard: úplná konfigurace se všemi klíči. Každý klíč je volitelný; oddíl bez entit se nezobrazí.
type: custom:ha-dum-dashboard
language: auto                      # auto | cs | en | sv
house_mode_entity: input_select.house_mode
house_modes:
  summer: Léto                      # hodnota režimu domu, při které je Klimatizace nad Topením
failed_actions: sensor.dum_nesplnene_akce
clear_failed_script: script.dum_nesplnene_smazat
snoozed: sensor.dum_odlozeno          # seznam odložených věcí (yaml/packages/fronta.yaml)
snooze_script: script.dum_odlozit    # volá se s klic a do (RRRR-MM-DD)
batteries:
  - name: Okno Ložnice
    low: binary_sensor.loznice_okno_loznice_battery
    level: sensor.loznice_okno_loznice_battery
    type: sensor.loznice_okno_loznice_battery_type
  - name: Okno Maxík
    low: binary_sensor.maxik_okno_maxik_battery
    level: sensor.maxik_okno_maxik_battery
    type: sensor.maxik_okno_maxik_battery_type
  - name: Okno Mikuláš
    low: binary_sensor.mikulas_okno_mikulas_battery
    level: sensor.mikulas_okno_mikulas_battery
    type: sensor.mikulas_okno_mikulas_battery_type
  - name: Okno Pracovna
    low: binary_sensor.pracovna_okno_pracovna_battery
    level: sensor.pracovna_okno_pracovna_battery
    type: sensor.pracovna_okno_pracovna_battery_type
  - name: Dveře Zahrada
    low: binary_sensor.obyvak_dvere_zahrada_battery
    level: sensor.obyvak_dvere_zahrada_battery
    type: sensor.obyvak_dvere_zahrada_battery_type
  - name: Garážová vrata
    low: binary_sensor.garaz_garazova_vrata_battery
    level: sensor.garaz_garazova_vrata_battery
    type: sensor.garaz_garazova_vrata_battery_type
  - name: Teploměr Garáž
    low: binary_sensor.garaz_teplomer_garaz_battery
    level: sensor.garaz_teplomer_garaz_battery
    type: sensor.garaz_teplomer_garaz_battery_type
filters:                            # filtr klimatizace: hodiny od čištění proti prahu klimatizace; Hotovo je vynuluje
  - name: Klimatizace Obývák
    hours: input_number.obyvak_ac_obyvak_filtr_hodiny
    threshold: select.obyvak_ac_obyvak_dust_filter_alarm_threshold
  - name: Klimatizace Ložnice
    hours: input_number.loznice_ac_loznice_filtr_hodiny
    threshold: select.loznice_ac_loznice_dust_filter_alarm_threshold
  - name: Klimatizace Maxík
    hours: input_number.maxik_ac_maxik_filtr_hodiny
    threshold: select.maxik_ac_maxik_dust_filter_alarm_threshold
  - name: Klimatizace Mikuláš
    hours: input_number.mikulas_ac_mikulas_filtr_hodiny
    threshold: select.mikulas_ac_mikulas_dust_filter_alarm_threshold
  - name: Klimatizace Pracovna
    hours: input_number.pracovna_ac_pracovna_filtr_hodiny
    threshold: select.pracovna_ac_pracovna_dust_filter_alarm_threshold
laundry:                            # prádlo čeká (input_boolean, yaml/packages/pradlo.yaml); Hotovo ho vypne
  - name:
      cs: Pračka
      en: Washing machine
      sv: Tvättmaskin
    entity: input_boolean.technicka_mistnost_pracka_pradlo_ceka
  - name:
      cs: Sušička
      en: Dryer
      sv: Torktumlare
    entity: input_boolean.technicka_mistnost_susicka_pradlo_ceka
maintenance:                        # údržba po počtu cyklů (counter, yaml/packages/udrzba.yaml); Hotovo počítadlo vynuluje
  - name:
      cs: Pračka
      en: Washing machine
      sv: Tvättmaskin
    task:
      cs: Vyčistit buben
      en: Clean the drum
      sv: Rengör trumman
    counter: counter.technicka_mistnost_pracka_cykly_od_udrzby
    every: 40
  - name:
      cs: Myčka
      en: Dishwasher
      sv: Diskmaskin
    task:
      cs: Vyčistit filtr
      en: Clean the filter
      sv: Rengör filtret
    counter: counter.kuchyne_mycka_cykly_od_udrzby
    every: 30
  - name:
      cs: Sušička
      en: Dryer
      sv: Torktumlare
    task:
      cs: Vyčistit kondenzátor
      en: Clean the condenser
      sv: Rengör kondensorn
    counter: counter.technicka_mistnost_susicka_cykly_od_udrzby
    every: 30
running:
  - name:
      cs: Pračka
      en: Washing machine
      sv: Tvättmaskin
    entity: input_boolean.technicka_mistnost_pracka_bezi
  - name:
      cs: Sušička
      en: Dryer
      sv: Torktumlare
    entity: input_boolean.technicka_mistnost_susicka_bezi
  - name:
      cs: Myčka
      en: Dishwasher
      sv: Diskmaskin
    entity: input_boolean.kuchyne_mycka_bezi
covers:
  script: script.zaluzie_posun      # volá se s entity, pos, tilt pro každou žaluzii
  tolerance: 5                      # % odchylky polohy a náklonu, kdy žaluzie ještě patří do předvolby
  last_action: sensor.zaluzie_posledni_akce   # kdo žaluzií pohnul naposledy (detail žaluzií)
  entities:                         # entita, nebo name a entity (jméno v detailu)
    - name: Ložnice
      entity: cover.loznice_zaluzie_loznice
    - name: Maxík
      entity: cover.maxik_zaluzie_maxik
    - name: Mikuláš
      entity: cover.mikulas_zaluzie_mikulas
    - name: Pracovna
      entity: cover.pracovna_zaluzie_pracovna
  presets:
    - name:
        cs: Den
        en: Day
        sv: Dag
      position: 100
      tilt: 100
    - name:
        cs: Stín
        en: Shade
        sv: Skugga
      position: 0
      tilt: 100
    - name:
        cs: Tma
        en: Dark
        sv: Mörker
      position: 0
      tilt: 0
ventilation:
  mode: input_boolean.ventilation_mode
  fans:
    - name: Koupelna přízemí
      entity: switch.koupelna_vetrak_koupelna_prizemi
    - name: Koupelna patro
      entity: switch.koupelna_vetrak_koupelna_patro
    - name: Koupelna ložnice
      entity: switch.koupelna_vetrak_koupelna_loznice
    - name: Záchod patro
      entity: switch.koupelna_vetrak_zachod_patro
    - name: Stojanový ventilátor
      entity: fan.zhimi_za5_a22b_fan
heating:
  resume: button.tado_ce_hub_resume_all_schedules
  rooms:
    - name: Obývák
      entity: climate.obyvak_tado_ce_obyvak
    - name: Ložnice
      entity: climate.loznice_tado_ce_loznice
    - name: Maxík
      entity: climate.maxik_tado_ce_maxik
    - name: Mikuláš
      entity: climate.mikulas_tado_ce_mikulas
    - name: Pracovna
      entity: climate.pracovna_tado_ce_pracovna
    - name: Garáž
      entity: climate.garaz_tado_ce_garaz
cooling:
  rooms:
    - name: Obývák
      entity: climate.obyvak_ac_obyvak
    - name: Ložnice
      entity: climate.loznice_ac_loznice
    - name: Maxík
      entity: climate.maxik_ac_maxik
    - name: Mikuláš
      entity: climate.mikulas_ac_mikulas
    - name: Pracovna
      entity: climate.pracovna_ac_pracovna
devices:                            # další oddíly dlaždic, každý druh vlastní (dvojklep nebo podržení: světlo, vypínač, větrák přepne; vysavač spustí úklid nebo pošle do doku)
  - name:
      cs: Světla
      en: Lights
      sv: Lampor
    entities:
      - name: Kuchyně
        entity: switch.kuchyne_osvetleni_kuchyne
      - name: Lampa pracovna
        entity: light.yeelink_bslamp2_cd35_light
  - name:
      cs: Zásuvky
      en: Sockets
      sv: Uttag
    entities:
      - name: Zásuvka IKEA
        entity: switch.pracovna_zasuvka_ikea
  - name:
      cs: Vysavače
      en: Vacuums
      sv: Dammsugare
    entities:
      - name: Patro
        entity: vacuum.roborock_s5_ea9e_robot_cleaner
      - name: Přízemí
        entity: vacuum.technicka_mistnost_roborock_prizemi_robot_cleaner
health:                             # Zdraví: baterie čidel (%), připojení (on = připojeno), systém (hodnota s volitelnou mezí max, stav svazku jiný než normal, nebo binary_sensor: on = problém), aktualizace
  battery_low: 20                   # pod touto hodnotou (%) je baterie ve „Vyžaduje pozornost“
  batteries:
    - name: Okno Ložnice
      entity: sensor.loznice_okno_loznice_battery
    - name: Okno Maxík
      entity: sensor.maxik_okno_maxik_battery
    - name: Okno Mikuláš
      entity: sensor.mikulas_okno_mikulas_battery
    - name: Okno Pracovna
      entity: sensor.pracovna_okno_pracovna_battery
    - name: Dveře Zahrada
      entity: sensor.obyvak_dvere_zahrada_battery
    - name: Garážová vrata
      entity: sensor.garaz_garazova_vrata_battery
    - name: Teploměr Garáž
      entity: sensor.garaz_teplomer_garaz_battery
  connections:
    - name: Tado bridge
      entity: binary_sensor.tado_ce_internet_bridge_connection
    - name: Tado Obývák
      entity: binary_sensor.obyvak_tado_ce_obyvak_connection_ru01
    - name: Tado Ložnice
      entity: binary_sensor.loznice_tado_ce_loznice_connection
    - name: Tado Maxík
      entity: binary_sensor.maxik_tado_ce_maxik_connection
    - name: Tado Mikuláš
      entity: binary_sensor.mikulas_tado_ce_mikulas_connection
    - name: Tado Pracovna
      entity: binary_sensor.pracovna_tado_ce_pracovna_connection
    - name: Tado Garáž
      entity: binary_sensor.garaz_tado_ce_garaz_connection
  system:
    - name: NAS svazek
      entity: sensor.madlovi_volume_1_status
    - name: NAS obsazeno
      entity: sensor.madlovi_volume_1_volume_used
      max: 85                       # nad touto hodnotou je to problém
    - name: NAS teplota
      entity: sensor.madlovi_temperature
      max: 60
    - name: NAS disk 1 sektory
      entity: binary_sensor.madlovi_drive_1_exceeded_max_bad_sectors
    - name: NAS disk 1 životnost
      entity: binary_sensor.madlovi_drive_1_below_min_remaining_life
    - name: NAS disk 2 sektory
      entity: binary_sensor.madlovi_drive_2_exceeded_max_bad_sectors
    - name: NAS disk 2 životnost
      entity: binary_sensor.madlovi_drive_2_below_min_remaining_life
  updates: true                     # všechny aktualizace Home Assistantu (update.*), které čekají
send_delay_seconds: 2                # popup Topení / Klimatizace odešle změnu tolik sekund po poslední (nebo při zavření)
guard:
  hold_ms: 550                      # podržení chráněného prvku
  double_tap_ms: 400                # druhé klepnutí do této doby
  hint_seconds: 3                   # jak dlouho je vidět nápověda
