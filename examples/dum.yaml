# Dům Dashboard: úplná konfigurace se všemi klíči. Každý klíč je volitelný; oddíl bez entit se nezobrazí.
type: custom:ha-dum-dashboard
language: auto                      # auto | cs | en | sv
house_mode_entity: input_select.house_mode
house_modes:
  summer: Léto                      # hodnota režimu domu, při které je Klimatizace nad Topením
failed_actions: sensor.dum_nesplnene_akce
clear_failed_script: script.dum_nesplnene_smazat
snoozed: sensor.dum_odlozeno          # seznam odložených věcí (yaml/packages/fronta.yaml)
snooze_script: script.dum_odlozit    # volá se s klic a do (RRRR-MM-DD)
batteries:
  - name: Okno Ložnice
    low: binary_sensor.loznice_okno_loznice_battery
    level: sensor.loznice_okno_loznice_battery
    type: sensor.loznice_okno_loznice_battery_type
  - name: Okno Maxík
    low: binary_sensor.maxik_okno_maxik_battery
    level: sensor.maxik_okno_maxik_battery
    type: sensor.maxik_okno_maxik_battery_type
  - name: Okno Mikuláš
    low: binary_sensor.mikulas_okno_mikulas_battery
    level: sensor.mikulas_okno_mikulas_battery
    type: sensor.mikulas_okno_mikulas_battery_type
  - name: Okno Pracovna
    low: binary_sensor.pracovna_okno_pracovna_battery
    level: sensor.pracovna_okno_pracovna_battery
    type: sensor.pracovna_okno_pracovna_battery_type
  - name: Dveře Zahrada
    low: binary_sensor.obyvak_dvere_zahrada_battery
    level: sensor.obyvak_dvere_zahrada_battery
    type: sensor.obyvak_dvere_zahrada_battery_type
  - name: Garážová vrata
    low: binary_sensor.garaz_garazova_vrata_battery
    level: sensor.garaz_garazova_vrata_battery
    type: sensor.garaz_garazova_vrata_battery_type
  - name: Teploměr Garáž
    low: binary_sensor.garaz_teplomer_garaz_battery
    level: sensor.garaz_teplomer_garaz_battery
    type: sensor.garaz_teplomer_garaz_battery_type
filters:                            # filtr klimatizace: hodiny od čištění proti prahu klimatizace; Hotovo je vynuluje
  - name: Klimatizace Obývák
    hours: input_number.obyvak_ac_obyvak_filtr_hodiny
    threshold: select.obyvak_ac_obyvak_dust_filter_alarm_threshold
  - name: Klimatizace Ložnice
    hours: input_number.loznice_ac_loznice_filtr_hodiny
    threshold: select.loznice_ac_loznice_dust_filter_alarm_threshold
  - name: Klimatizace Maxík
    hours: input_number.maxik_ac_maxik_filtr_hodiny
    threshold: select.maxik_ac_maxik_dust_filter_alarm_threshold
  - name: Klimatizace Mikuláš
    hours: input_number.mikulas_ac_mikulas_filtr_hodiny
    threshold: select.mikulas_ac_mikulas_dust_filter_alarm_threshold
  - name: Klimatizace Pracovna
    hours: input_number.pracovna_ac_pracovna_filtr_hodiny
    threshold: select.pracovna_ac_pracovna_dust_filter_alarm_threshold
laundry:                            # prádlo čeká (input_boolean, yaml/packages/pradlo.yaml); Hotovo ho vypne
  - name:
      cs: Pračka
      en: Washing machine
      sv: Tvättmaskin
    entity: input_boolean.technicka_mistnost_pracka_pradlo_ceka
  - name:
      cs: Sušička
      en: Dryer
      sv: Torktumlare
    entity: input_boolean.technicka_mistnost_susicka_pradlo_ceka
running:
  - name:
      cs: Pračka
      en: Washing machine
      sv: Tvättmaskin
    entity: input_boolean.technicka_mistnost_pracka_bezi
  - name:
      cs: Sušička
      en: Dryer
      sv: Torktumlare
    entity: input_boolean.technicka_mistnost_susicka_bezi
  - name:
      cs: Myčka
      en: Dishwasher
      sv: Diskmaskin
    entity: input_boolean.kuchyne_mycka_bezi
covers:
  script: script.zaluzie_posun      # volá se s entity, pos, tilt pro každou žaluzii
  tolerance: 5                      # % odchylky polohy a náklonu, kdy žaluzie ještě patří do předvolby
  entities:
    - cover.loznice_zaluzie_loznice
    - cover.maxik_zaluzie_maxik
    - cover.mikulas_zaluzie_mikulas
    - cover.pracovna_zaluzie_pracovna
  presets:
    - name:
        cs: Den
        en: Day
        sv: Dag
      position: 100
      tilt: 100
    - name:
        cs: Stín
        en: Shade
        sv: Skugga
      position: 0
      tilt: 100
    - name:
        cs: Tma
        en: Dark
        sv: Mörker
      position: 0
      tilt: 0
ventilation:
  mode: input_boolean.ventilation_mode
  fans:
    - name: Koupelna přízemí
      entity: switch.koupelna_vetrak_koupelna_prizemi
    - name: Koupelna patro
      entity: switch.koupelna_vetrak_koupelna_patro
    - name: Koupelna ložnice
      entity: switch.koupelna_vetrak_koupelna_loznice
    - name: Záchod patro
      entity: switch.koupelna_vetrak_zachod_patro
    - name: Stojanový ventilátor
      entity: fan.zhimi_za5_a22b_fan
heating:
  resume: button.tado_ce_hub_resume_all_schedules
  rooms:
    - name: Obývák
      entity: climate.obyvak_tado_ce_obyvak
    - name: Ložnice
      entity: climate.loznice_tado_ce_loznice
    - name: Maxík
      entity: climate.maxik_tado_ce_maxik
    - name: Mikuláš
      entity: climate.mikulas_tado_ce_mikulas
    - name: Pracovna
      entity: climate.pracovna_tado_ce_pracovna
    - name: Garáž
      entity: climate.garaz_tado_ce_garaz
cooling:
  rooms:
    - name: Obývák
      entity: climate.obyvak_ac_obyvak
    - name: Ložnice
      entity: climate.loznice_ac_loznice
    - name: Maxík
      entity: climate.maxik_ac_maxik
    - name: Mikuláš
      entity: climate.mikulas_ac_mikulas
    - name: Pracovna
      entity: climate.pracovna_ac_pracovna
guard:
  hold_ms: 550                      # podržení chráněného prvku
  double_tap_ms: 400                # druhé klepnutí do této doby
  hint_seconds: 3                   # jak dlouho je vidět nápověda
